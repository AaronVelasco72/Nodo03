<!doctype html>
<!--
  Nodo 03 · Oficialía de Partes Cifrada
  ======================================
  Interfaz de una sola página (SPA) sin frameworks ni dependencias externas:
  funciona aunque el laboratorio no tenga internet (sin CDNs ni fuentes remotas).

  Estructura:
    - <nav class="carpeta">  pestañas de navegación (en celular se vuelve barra inferior)
    - <header class="membrete"> identidad del nodo + contador de pendientes + estado de conexión
    - <main id="vista">      aquí app.js dibuja la pantalla activa (#/panel, #/enviar, ...)
    - <div id="avisos">      notificaciones emergentes ("telegramas") de las alertas en tiempo real
    - <aside id="cajon">     panel lateral desplegable de Consultas
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1D2B44">
  <title>Nodo 03 · Oficialía de Partes Cifrada</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23B4322A' stroke-width='3'/%3E%3Ctext x='16' y='21' font-size='13' text-anchor='middle' font-family='Georgia' fill='%23B4322A' font-weight='700'%3E03%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a class="saltar" href="#vista">Saltar al contenido</a>

  <nav class="carpeta" aria-label="Secciones">
    <div class="carpeta__marca">
      <span class="sello-mini" aria-hidden="true">03</span>
      <div>
        <strong>Oficialía de Partes</strong>
        <small>Cifrada · Equipo 3</small>
      </div>
    </div>
    <a href="#/panel" data-ruta="panel"><span class="ico" aria-hidden="true">◎</span><span>Panel</span></a>
    <a href="#/enviar" data-ruta="enviar"><span class="ico" aria-hidden="true">✉</span><span>Enviar</span></a>
    <a href="#/solicitudes" data-ruta="solicitudes"><span class="ico" aria-hidden="true">⇩</span><span>Solicitudes</span><b class="contador" id="contador-pendientes" hidden>0</b></a>
    <a href="#/consultas" data-ruta="consultas"><span class="ico" aria-hidden="true">▤</span><span>Consultas</span></a>
    <a href="#/verificador" data-ruta="verificador"><span class="ico" aria-hidden="true">✓</span><span>Verificador</span></a>
    <a href="#/nodos" data-ruta="nodos"><span class="ico" aria-hidden="true">⌘</span><span>Nodos</span></a>
    <a href="#/ajustes" data-ruta="ajustes"><span class="ico" aria-hidden="true">⚙</span><span>Ajustes</span></a>
    <p class="carpeta__pie">Virología y Criptografía<br>UPIICSA · IPN</p>
  </nav>

  <div class="escritorio">
    <header class="membrete">
      <div class="membrete__id">
        <span class="etiqueta">Nodo</span>
        <strong id="nodo-id">—</strong>
        <code id="nodo-dir" title="Dirección que se anuncia a los demás equipos">—</code>
      </div>
      <div class="membrete__estado" id="estado-conexion" data-estado="conectando" role="status">
        <i aria-hidden="true"></i><span>Conectando…</span>
      </div>
    </header>

    <main id="vista" tabindex="-1" aria-live="polite"></main>
  </div>

  <div id="avisos" aria-live="assertive"></div>

  <div id="velo" hidden></div>
  <aside id="cajon" aria-hidden="true" aria-label="Detalle del registro">
    <button class="cajon__cerrar" type="button" aria-label="Cerrar">×</button>
    <div id="cajon-contenido"></div>
  </aside>

  <script src="js/app.js"></script>
</body>
</html>
